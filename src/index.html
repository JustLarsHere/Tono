<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:FILL@1" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tono</title>

    <script type="module" src="/main.js" defer></script>
  </head>
  <body>
    <nav data-tauri-drag-region>
      <section id="current">
        <div id="playlist_name" class="big" contenteditable="plaintext-only">My Playlist</div>
        <div class="icon">
          <span class="icon_button material-symbols-outlined">keyboard_arrow_down</span>
        </div>
      </section>
      <section id="playlist">
        <div id="info">
          <p class="faded subtext">3 Tracks</p>
          <p class="faded subtext">04/10/2026</p>
        </div>
        <div id="items">
          <div class="track button" id="test">
            <div class="track_info">
              <div id="track_name" class="semibig">The Conflict of The mind</div>
              <div id="track_author" class="subtext faded">AURORA</div>
            </div>
          </div>
          <!-- remove track below after -->
          <div class="track button">
            <div class="track_info">
              <div id="track_name" class="semibig">The Seed</div>
              <div id="track_author" class="subtext faded">AURORA</div>
            </div>
          </div>
          <div class="button" id="add">+ Add Track</div>
        </div>
      </section>
      <section id="more">
        <div class="settings">
          <span class="icon_button material-symbols-outlined">settings</span>
        </div>
        <div class="help">
          <span class="icon_button material-symbols-outlined">question_mark</span>
        </div>
      </section>
    </nav>
    <main data-tauri-drag-region>
      <div id="options">
        <div class="left">
          <span class="icon_button material-symbols-outlined">left_panel_close</span>
        </div>
        <div class="right">
          <span class="icon_button material-symbols-outlined">collapse_content</span>
          <span class="icon_button material-symbols-outlined">remove</span>
          <span class="icon_button material-symbols-outlined">close_small</span>
        </div>
      </div>
      <div id="cover" data-tauri-drag-region></div>
      <div id="controls">
        <div id="playback">
          <div>previous</div>
          <div>playpause</div>
          <div>next</div>
        </div>
        <div id="track_info">
          <div class="playerhead">progress</div>
          <div class="trackinfo">
            <div class="rightnow">2:51</div>
            <div class="namee">Aurora ~ The Conflict Of The Mind</div>
            <div class="total">3:10</div>
          </div>
        </div>
      </div>
      <div id="cover_background" data-tauri-drag-region></div>
    </main>
  </body>
</html>
