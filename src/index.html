<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:FILL@1" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tono</title>

    <script type="module" src="/main.js" defer></script>
  </head>
  <body>
    <nav data-tauri-drag-region>
      <section id="current">
        <div id="name" class="big">My Playlist</div>
        <div class="icon">
          <span class="material-symbols-outlined">keyboard_arrow_down</span>
        </div>
      </section>
      <section id="playlist">
        <div id="info">
          <p class="subtext">3 Tracks</p>
          <p class="">Date</p>
        </div>
        <div id="items">
          <div class="track">
            <div class="track_info">
              <div id="track_name" class="semibig">The Conflict of The mind</div>
              <div id="track_author" class="subtext">AURORA</div>
            </div>
            <div id="track_options">delete</div>
          </div>
          <!-- remove track below after -->
          <div class="track">
            <div class="track_info">
              <div id="track_name" class="semibig">The Conflict of The mind</div>
              <div id="track_author" class="subtext">AURORA</div>
            </div>
            <div id="track_options">delete</div>
          </div>
          <div id="add">+ Add Track</div>
        </div>
      </section>
      <section id="more">
        <div class="settings">
          <span class="material-symbols-outlined">settings</span>
        </div>
        <div class="help">
          <span class="material-symbols-outlined">question_mark</span>
        </div>
      </section>
    </nav>
    <main data-tauri-drag-region>
      <div id="cover" data-tauri-drag-region></div>
      <div id="cover_background"></div>
    </main>
  </body>
</html>
