<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:FILL@1" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tono</title>

  <script type="module" src="/main.js" defer></script>
</head>

<body>
<nav data-tauri-drag-region>
  <section id="sidebar_header">
    <div id="sidebar_playlist_title" class="text_large" contenteditable="plaintext-only">
      My Playlist
    </div>

    <div class="icon">
      <span class="icon_button material-symbols-outlined">keyboard_arrow_down</span>
    </div>
  </section>

  <section id="sidebar_playlist">
    <div id="sidebar_playlist_metadata">
      <p class="text_muted text_small">3 Tracks</p>
      <p class="text_muted text_small">04/10/2026</p>
    </div>

    <div id="sidebar_track_list">
      <div class="track button" id="sidebar_track_test">
        <div class="track_info">
          <div class="sidebar_track_title text_medium">
            The Conflict of The Mind
          </div>
          <div class="sidebar_track_artist text_small text_muted">
            AURORA
          </div>
        </div>
      </div>

      <!-- remove track below after -->
      <div class="track button">
        <div class="track_info">
          <div class="sidebar_track_title text_medium">
            The Seed
          </div>
          <div class="sidebar_track_artist text_small text_muted">
            AURORA
          </div>
        </div>
      </div>

      <div class="button" id="sidebar_add_track">
        + Add Track
      </div>
    </div>
  </section>

  <section id="sidebar_footer">
    <div class="settings">
      <span class="icon_button material-symbols-outlined">settings</span>
    </div>

    <div class="help">
      <span class="icon_button material-symbols-outlined">question_mark</span>
    </div>
  </section>
</nav>

<main data-tauri-drag-region>
  <div id="player_window_controls">
    <div class="window_controls_left">
      <span class="icon_button material-symbols-outlined">left_panel_close</span>
    </div>

    <div class="window_controls_right">
      <span class="icon_button material-symbols-outlined">collapse_content</span>
      <span class="icon_button material-symbols-outlined">remove</span>
      <span class="icon_button material-symbols-outlined">close_small</span>
    </div>
  </div>

  <div id="player_album_art" data-tauri-drag-region></div>

  <div id="player_controls">
    <div id="player_playback_controls">
      <span class="icon_button material-symbols-outlined">skip_previous</span>
      <span class="icon_button material-symbols-outlined">pause</span>
      <span class="icon_button material-symbols-outlined">skip_next</span>
    </div>

    <div id="player_track_metadata">
      <div class="player_progress_track">
        <div class="player_progress"></div>
      </div>

      <div class="player_track_details">
        <div class="player_current_time">2:51</div>
        <div class="player_track_title">
          Aurora ~ The Conflict Of The Mind
        </div>
        <div class="player_total_time">3:10</div>
      </div>
    </div>
  </div>

  <div id="player_album_art_background" data-tauri-drag-region></div>
</main>
</body>
</html>
